[project]
name = "miniq"
version = "0.1.0"
description = "A minimal task queue library with pluggable backends."
readme = "README.md"
authors = [
    { name = "ChristopherTablasDeLaCruz", email = "101226939+ChristopherTablasDeLaCruz@users.noreply.github.com" }
]
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.scripts]
miniq = "miniq.cli:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "hypothesis>=6.100",
    "pre-commit>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/miniq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
